<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>ShockAuto</title>
  <defs>
    <radialGradient id="glow" cx="32" cy="32" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A2256"/>
      <stop offset="1" stop-color="#110F24"/>
    </radialGradient>

    <path id="s" d="M26 21.5C24 18.8 21.3 17.5 18 17.5C13.2 17.5 10 20 10 24C10 28 13.5 29.5 18 30.8C22.8 32.2 26.5 34 26.5 38.8C26.5 43.3 22.8 46.5 17.8 46.5C13.8 46.5 11 45 9 42.5"/>
    <path id="a" d="M28.3 46.5L37.5 17.5L46.7 46.5"/>

