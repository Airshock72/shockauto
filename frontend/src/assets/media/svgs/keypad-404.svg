<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" overflow="visible">
  <defs>
    <linearGradient id="kp-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: oklch(0.96 0.006 275)" />
      <stop offset="1" style="stop-color: oklch(0.8 0.012 275)" />
    </linearGradient>
    <linearGradient id="kp-plug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: oklch(0.94 0.006 275)" />
      <stop offset="1" style="stop-color: oklch(0.78 0.012 275)" />
    </linearGradient>
    <linearGradient id="kp-key-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: oklch(1 0 0)" />
      <stop offset="0.55" style="stop-color: oklch(0.97 0.012 285)" />
      <stop offset="1" style="stop-color: color-mix(in oklch, var(--primary) 30%, white)" />
    </linearGradient>
    <linearGradient id="kp-key-light-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: oklch(0.88 0.015 285)" />
      <stop offset="1" style="stop-color: color-mix(in oklch, var(--primary) 40%, oklch(0.8 0.02 285))" />
    </linearGradient>
    <linearGradient id="kp-key-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: color-mix(in oklch, var(--primary) 82%, white)" />
      <stop offset="1" style="stop-color: var(--primary)" />
    </linearGradient>
    <linearGradient id="kp-key-primary-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--primary)" />
      <stop offset="1" style="stop-color: color-mix(in oklch, var(--primary) 70%, black)" />
    </linearGradient>
    <filter id="kp-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Cable -->
  <path class="kp-cable" d="M180 56 C180 20 150 10 160 -25 C170 -60 230 -50 225 -95 C220 -140 165 -135 175 -185 C185 -235 240 -225 230 -280 C220 -335 205 -370 212 -420 L222 -1200" style="stroke: var(--primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Electric pulse travelling down the cable -->
  <path class="kp-cable kp-pulse" d="M180 56 C180 20 150 10 160 -25 C170 -60 230 -50 225 -95 C220 -140 165 -135 175 -185 C185 -235 240 -225 230 -280 C220 -335 205 -370 212 -420 L222 -1200" pathLength="100" style="stroke: var(--neon)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Invisible, wider grab area for dragging the cable -->
  <path class="kp-cable kp-cable-hit" d="M180 56 C180 20 150 10 160 -25 C170 -60 230 -50 225 -95 C220 -140 165 -135 175 -185 C185 -235 240 -225 230 -280 C220 -335 205 -370 212 -420 L222 -1200" stroke="transparent" stroke-width="26" stroke-linecap="round" />

  <!-- Plug -->
  <rect x="164" y="50" width="32" height="18" rx="3" fill="url(#kp-plug)" style="stroke: oklch(0.75 0.012 275)" stroke-width="1" />

  <!-- Spark on pulse arrival -->
  <circle class="kp-spark" cx="180" cy="52" r="10" style="fill: var(--neon)" />

  <!-- Frame -->
  <g filter="url(#kp-shadow)">
    <rect x="18" y="64" width="324" height="140" rx="24" fill="url(#kp-frame)" style="stroke: oklch(0.75 0.012 275)" stroke-width="1" />
  </g>
  <rect x="32" y="78" width="296" height="112" rx="15" style="fill: var(--foreground)" />

  <!-- Key 4 -->
  <g class="kp-key-hit">
    <rect x="44" y="88" width="88" height="94" rx="13" fill="url(#kp-key-light-side)" />
    <g class="kp-key-btn">
      <g class="kp-key kp-key-1">
        <rect class="kp-key-face" x="50" y="91" width="76" height="80" rx="11" fill="url(#kp-key-light)" />
        <text x="64" y="130" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="500" style="fill: var(--muted-foreground)">4</text>
        <text class="kp-digit-glow" x="64" y="130" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="500" style="fill: var(--primary)">4</text>
      </g>
    </g>
  </g>

  <!-- Key 0 -->
  <g class="kp-key-hit">
    <rect x="136" y="88" width="88" height="94" rx="13" fill="url(#kp-key-primary-side)" />
    <g class="kp-key-btn">
      <g class="kp-key kp-key-2">
        <rect class="kp-key-face" x="142" y="91" width="76" height="80" rx="11" fill="url(#kp-key-primary)" />
        <text x="156" y="130" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="500" style="fill: var(--primary-foreground)">0</text>
      </g>
    </g>
  </g>

  <!-- Key 4 -->
  <g class="kp-key-hit">
    <rect x="228" y="88" width="88" height="94" rx="13" fill="url(#kp-key-light-side)" />
    <g class="kp-key-btn">
      <g class="kp-key kp-key-3">
        <rect class="kp-key-face" x="234" y="91" width="76" height="80" rx="11" fill="url(#kp-key-light)" />
        <text x="248" y="130" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="500" style="fill: var(--muted-foreground)">4</text>
        <text class="kp-digit-glow" x="248" y="130" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="500" style="fill: var(--primary)">4</text>
      </g>
    </g>
  </g>
</svg>
